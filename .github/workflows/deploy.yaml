name: Deploy presentation
on:
  push:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy presentation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/code/aprendepython-slides
            git pull
            ~/.local/bin/just build
