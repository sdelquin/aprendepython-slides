<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Aprende Python</title>

    <link rel="stylesheet" href="dist/reset.css" />
    <link rel="stylesheet" href="dist/reveal.css" />
    <link rel="stylesheet" href="dist/theme/moon.css" />
    <link rel="stylesheet" href="css/custom.css" />

    <!-- Theme used for syntax highlighted code -->
    <link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
  </head>
  <body>
    <div class="reveal">
      <a class="no-prefix" href="https://aprendepython.es">
        <img class="logo" src="images/logo-aprendepython.svg" alt="Logo" />
      </a>
      <div class="slides">
        <section>
          <h1>Aprende Python</h1>
          <img class="r-stretch" src="./images/logo-aprendepython.svg" />
          <p>...comiendo pypas</p>
        </section>
        <section>
          <h2>Soy Sergio 👋</h2>
          <div class="columns">
            <div class="fragment col30">
              <figure>
                <img class="framed" src="./images/avatar.jpg" caption="hola" />
                <figcaption>Yo en Madrid con mucho frío</figcaption>
              </figure>
            </div>
            <ul>
              <li class="fragment">
                Profe de <span class="hl">FP</span> en
                <a href="https://iespto.es">Tenerife</a>
              </li>
              <li class="fragment">Clases de Python 🐍 y Django 🦄</li>
              <li class="fragment">Cofundador de Python Canarias 🏖️</li>
              <li class="fragment">
                Coorganizador
                <a href="https://2023.es.pycon.org/">PyConES 2023 Canarias</a>
              </li>
              <li class="fragment">Tengo un 🎹 pero no sé tocarlo</li>
              <li class="fragment">Me gustan los emojis 😜</li>
            </ul>
          </div>
        </section>
      </div>
    </div>

    <script src="dist/reveal.js"></script>
    <script src="dist/plugin/notes.js"></script>
    <script src="dist/plugin/markdown.js"></script>
    <script src="dist/plugin/highlight.js"></script>
    <script>
      // More info about initialization & config:
      // - https://revealjs.com/initialization/
      // - https://revealjs.com/config/
      Reveal.initialize({
        hash: true,

        // Learn about plugins: https://revealjs.com/plugins/
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      });
    </script>
  </body>
</html>
